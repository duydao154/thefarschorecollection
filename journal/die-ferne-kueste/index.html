<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Far Shore ist kein Ort auf einer Karte. Die Geschichte eines verbannten Dichters, einer Insel am Rand der Welt und des Rauchs, der ihn heimbrachte."
    />
    <!-- Focus keyword: Far Shore Bedeutung — secondary: Wabi-Sabi Räucherwerk, Su Dongpo, Achtsamkeit Ritual, Räucherstäbchen Meditation -->
    <title>Die ferne Küste: Die Geschichte hinter Far Shore</title>
    <link rel="icon" type="image/png" href="/images/logo/logo_symbol.png" />
    <link rel="canonical" href="/journal/die-ferne-kueste/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/typography.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/animations.css" />
    <link rel="stylesheet" href="/css/nav.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <link rel="stylesheet" href="/css/article.css" />
  </head>
  <body>
    <!-- NAV -->
    <nav
      class="site-nav site-nav--scrolled"
      role="navigation"
      data-i18n-aria="nav.aria"
    >
      <div class="site-nav__inner">
        <a href="/" class="site-nav__wordmark" aria-label="Far Shore home">
          <img
            src="/images/logo/logo_horizontal.png"
            alt="Far Shore"
            class="site-nav__logo"
          />
        </a>
        <ul class="site-nav__links" role="list">
          <li>
            <a
              href="/#collection"
              class="site-nav__link"
              data-i18n="nav.shop"
            ></a>
          </li>
          <li>
            <a
              href="/#journal"
              class="site-nav__link"
              data-i18n="nav.journal"
            ></a>
          </li>
          <li>
            <a href="/#ritual" class="site-nav__link" data-i18n="nav.story"></a>
          </li>
          <li>
            <a
              href="/#contact"
              class="site-nav__link"
              data-i18n="nav.contact"
            ></a>
          </li>
          <li><button class="lang-toggle" id="langToggle">EN</button></li>
        </ul>
        <button class="site-nav__hamburger" data-i18n-aria="nav.open">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>

    <!-- Mobile overlay -->
    <div
      class="site-nav__overlay"
      role="dialog"
      aria-modal="true"
      aria-label="Navigationsmenü"
    >
      <button class="site-nav__overlay-close" data-i18n-aria="nav.close">
        &times;
      </button>
      <nav>
        <a
          href="/#collection"
          class="site-nav__overlay-link"
          data-i18n="nav.shop"
        ></a>
        <a
          href="/#journal"
          class="site-nav__overlay-link"
          data-i18n="nav.journal"
        ></a>
        <a
          href="/#ritual"
          class="site-nav__overlay-link"
          data-i18n="nav.story"
        ></a>
        <a
          href="/#contact"
          class="site-nav__overlay-link"
          data-i18n="nav.contact"
        ></a>
      </nav>
      <button class="lang-toggle lang-toggle--overlay" id="langToggleOverlay">
        EN
      </button>
    </div>

    <!-- ARTICLE HERO -->
    <header class="article-hero">
      <div class="article-hero__inner">
        <a href="/#journal" class="article-hero__back">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <polyline points="10,4 6,8 10,12" />
          </svg>
          <span data-i18n="article.back"></span>
        </a>
        <span
          class="article-hero__label"
          data-i18n="die-ferne-kueste.label"
        ></span>
        <h1 class="article-hero__title" data-i18n="journal.card1.title"></h1>
        <div class="article-hero__divider" aria-hidden="true"></div>
        <p class="article-hero__meta" data-i18n="die-ferne-kueste.meta"></p>
      </div>
    </header>

    <!-- FEATURE IMAGE -->
    <img
      class="article-image"
      src="/images/journal/die-ferne-kueste/hero.jpg"
      alt="Die ferne Küste — Dünen an der Küste Südchinas"
    />

    <!-- ARTICLE BODY -->
    <main class="article-body" id="main-content">
      <div class="article-body__inner">
        <p data-i18n="die-ferne-kueste.body1" class="article-lead"></p>

        <p data-i18n="die-ferne-kueste.body2"></p>

        <h2 data-i18n="die-ferne-kueste.body3"></h2>

        <img
          data-i18n-alt="die-ferne-kueste.alt1"
          class="journal-image"
          src="/images/journal/die-ferne-kueste/inline-1.jpg"
          style="aspect-ratio: 1400 / 781"
        />

        <p data-i18n="die-ferne-kueste.body4"></p>

        <p data-i18n="die-ferne-kueste.body5"></p>

        <p data-i18n="die-ferne-kueste.body6"></p>

        <p data-i18n="die-ferne-kueste.body7"></p>

        <p data-i18n="die-ferne-kueste.body8"></p>

        <h2 data-i18n="die-ferne-kueste.body9"></h2>

        <img
          data-i18n-alt="die-ferne-kueste.alt3"
          class="journal-image"
          src="/images/journal/die-ferne-kueste/inline-3.jpg"
          style="aspect-ratio: 4 / 3"
        />
        <p data-i18n="die-ferne-kueste.body10"></p>

        <p data-i18n="die-ferne-kueste.body11"></p>

        <h2 data-i18n="die-ferne-kueste.body12"></h2>

        <img
          data-i18n-alt="die-ferne-kueste.alt2"
          class="journal-image"
          src="/images/journal/die-ferne-kueste/inline-2.jpg"
          style="aspect-ratio: 4 / 3"
        />

        <p data-i18n="die-ferne-kueste.body13"></p>

        <p data-i18n="die-ferne-kueste.body14"></p>

        <h2 data-i18n="die-ferne-kueste.body15"></h2>

        <p data-i18n="die-ferne-kueste.body16"></p>

        <p data-i18n="die-ferne-kueste.body17"></p>

        <img
          data-i18n-alt="die-ferne-kueste.alt3"
          class="journal-image"
          src="/images/journal/die-ferne-kueste/inline-4.jpg"
          style="aspect-ratio: 4 / 3"
        />

        <h2 data-i18n="die-ferne-kueste.body18"></h2>

        <p data-i18n="die-ferne-kueste.body19"></p>

        <p data-i18n="die-ferne-kueste.body20"></p>

        <div class="article-cta">
          <p data-i18n="die-ferne-kueste.cta"></p>
          <div class="article-cta__actions">
            <a
              class="article-btn article-btn--solid"
              href="/journal/far-shore-ritual/"
              data-i18n="die-ferne-kueste.link1"
            ></a>
          </div>
        </div>
      </div>
    </main>

    <!-- MORE FROM THE JOURNAL -->
    <section class="article-more" aria-label="More from the journal">
      <div class="article-more__inner">
        <h2 class="article-more__heading" data-i18n="article.more"></h2>
        <div class="article-more__grid">
          <a href="/journal/far-shore-ritual/" class="article-more__card">
            <img
              class="article-more__card-image"
              src="/images/journal/far-shore-ritual/hero.jpg"
              alt="Das Far Shore Ritual"
            />
            <div class="article-more__card-body">
              <h3
                class="article-more__card-title"
                data-i18n="journal.card4.title"
              ></h3>
              <span
                class="article-more__card-link"
                data-i18n="article.read_more"
              ></span>
            </div>
          </a>

          <a href="/journal/kernloses-raeucherwerk/" class="article-more__card">
            <img
              class="article-more__card-image"
              src="/images/journal/kernloses-raeucherwerk/inline-1.jpeg"
              alt="Kernlos. Botanisch."
            />
            <div class="article-more__card-body">
              <h3
                class="article-more__card-title"
                data-i18n="journal.card2.title"
              ></h3>
              <span
                class="article-more__card-link"
                data-i18n="article.read_more"
              ></span>
            </div>
          </a>
        </div>
      </div>
    </section>

    <!-- FOOTER -->

      <div class="site-footer__inner">
        <div class="site-footer__wordmark">
          <img
            src="/images/logo/logo_vertical.png"
            alt="Far Shore"
            class="site-footer__logo"
          />
        </div>
        <div class="site-footer__socials" aria-label="Social media links">
          <a href="#" class="site-footer__social-link" aria-label="Instagram">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
              <circle cx="12" cy="12" r="4" />
              <circle
                cx="17.5"
                cy="6.5"
                r="0.5"
                fill="currentColor"
                stroke="none"
              />
            </svg>
          </a>
          <a href="#" class="site-footer__social-link" aria-label="Pinterest">

              fill="none"
              stroke="currentColor"

        <div class="site-footer__divider"></div>
        <div class="site-footer__newsletter">
          <p
            class="site-footer__newsletter-label"
            data-i18n="footer.newsletter.label"
          ></p>
          <form
            class="site-footer__newsletter-form"
            action="#"
            method="post"
            novalidate
          >
            <input
              class="site-footer__newsletter-input"
              type="email"
              name="email"
              data-i18n-placeholder="footer.newsletter.placeholder"
              aria-label="E-Mail-Adresse"
              required
            />
            <button
              class="site-footer__newsletter-btn"
              type="submit"
              data-i18n="footer.newsletter.btn"
            ></button>
          </form>
        </div>
        <div class="site-footer__divider"></div>
        <p class="site-footer__legal" data-i18n="footer.legal"></p>

    <script type="module" src="/js/i18n.js"></script>
    <script type="module" src="/js/nav.js"></script>
    <script type="module" src="/js/scroll-reveal.js"></script>

</html>
